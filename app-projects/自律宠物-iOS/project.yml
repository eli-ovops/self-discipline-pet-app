name: DisciplinedPet

options:
  bundleIdPrefix: com.cczij
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: 9
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1"

targetTemplates:
  P0Extension:
    type: app-extension
    platform: iOS
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: Config/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cczij.disciplinedpet

targets:
  DisciplinedPet:
    type: application
    platform: iOS
    sources:
      - path: DisciplinedPet
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet
        DEVELOPMENT_TEAM: SSY444792V
        PRODUCT_NAME: DisciplinedPet
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/DisciplinedPet-Info.plist
      properties:
        CFBundleDisplayName: Focumi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: FocumiLaunchCanvas
        UIUserInterfaceStyle: Light
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/DisciplinedPet.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cczij.disciplinedpet
    dependencies:
      - target: DisciplinedPetMonitor
      - target: DisciplinedPetShieldConfiguration
      - target: DisciplinedPetShieldAction
      - target: DisciplinedPetLiveActivity

  DisciplinedPetMonitor:
    templates: [P0Extension]
    sources:
      - path: DisciplinedPetMonitor
      - path: Shared
        excludes:
          - FocusLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet.monitor
        DEVELOPMENT_TEAM: SSY444792V
        PRODUCT_MODULE_NAME: DisciplinedPetMonitor
    info:
      path: Config/DisciplinedPetMonitor-Info.plist
      properties:
        CFBundleDisplayName: Focumi Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DisciplinedPetMonitorExtension

  DisciplinedPetShieldConfiguration:
    templates: [P0Extension]
    sources:
      - path: DisciplinedPetShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet.shieldconfiguration
        DEVELOPMENT_TEAM: SSY444792V
        PRODUCT_MODULE_NAME: DisciplinedPetShieldConfiguration
    info:
      path: Config/DisciplinedPetShieldConfiguration-Info.plist
      properties:
        CFBundleDisplayName: Focumi Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DisciplinedPetShieldConfigurationExtension

  DisciplinedPetShieldAction:
    templates: [P0Extension]
    sources:
      - path: DisciplinedPetShieldAction
      - path: Shared
        excludes:
          - FocusLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet.shieldaction
        DEVELOPMENT_TEAM: SSY444792V
        PRODUCT_MODULE_NAME: DisciplinedPetShieldAction
    info:
      path: Config/DisciplinedPetShieldAction-Info.plist
      properties:
        CFBundleDisplayName: Focumi Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DisciplinedPetShieldActionExtension

  DisciplinedPetLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: DisciplinedPetLiveActivity
      - path: Shared/FocusLiveActivityAttributes.swift
      - path: DisciplinedPet/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet.liveactivity
        DEVELOPMENT_TEAM: SSY444792V
        PRODUCT_MODULE_NAME: DisciplinedPetLiveActivity
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/DisciplinedPetLiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Focumi Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DisciplinedPetCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DisciplinedPetCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cczij.disciplinedpet.coretests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DisciplinedPet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DisciplinedPet
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DisciplinedPet

schemes:
  DisciplinedPet:
    build:
      targets:
        DisciplinedPet: all
        DisciplinedPetCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DisciplinedPetCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
